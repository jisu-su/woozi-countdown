<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOOZI Countdown : 2027.03.14</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/features/overrides.css">
</head>
<body>

    <div class="main-bg"></div>

    <div id="main-sidebar" class="sidebar">
        <div class="nav-icon" data-page-id="timer-page"><img src="timer.svg"></div>
        <div class="nav-icon" data-page-id="meal-page"><img src="뾰풀이.svg"></div>
        <div class="nav-icon" data-page-id="music-page"><img src="우주공장.jpg"></div>
        <div class="nav-icon" data-page-id="fan-page"><img src="봉봉이.svg"></div>
    </div>

    <div class="container">

        <!-- TIMER -->
        <section id="timer-page" class="page active full-screen">
            <div class="timer-label">WOOZI DISCHARGE COUNTDOWN</div>
            <div id="clock" class="countdown-display">00:00:00:00</div>
            <p class="click-guide">Click anywhere to start</p>
        </section>

        <!-- MEAL -->
        <section id="meal-page" class="page">
            <div class="meal-header">
                <button class="arrow-btn" data-week-direction="-1">〈</button>
                <h2 id="week-title">2026년 2월 식단표</h2>
                <button class="arrow-btn" data-week-direction="1">〉</button>
            </div>
            <div id="weekly-calendar" class="weekly-grid"></div>
        </section>

        <!-- MUSIC -->
        <section id="music-page" class="page scroll-page">
            <h2>🎸 우주공장 (Solo Songs)</h2>
            <div class="music-grid"></div>
        </section>

        <!-- FAN -->
        <section id="fan-page" class="page scroll-page">
            <div class="fan-header">
                <h2>💎 캐럿 소통창</h2>
                <p>우지에게 따뜻한 응원의 한마디를 남겨주세요!</p>
            </div>
            
            <div class="comment-section">
                <textarea id="comment-input" class="comment-input" placeholder="여기에 내용을 입력하세요..."></textarea>
                <div class="submit-container">
                    <button id="comment-submit" class="submit-btn">등록하기</button>
                </div>
                <div id="comment-list" class="comment-list">
                    </div>
            </div>
        </section>

    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
